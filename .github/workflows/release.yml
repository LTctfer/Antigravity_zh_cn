name: Build Minimal Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build zh-cn pack
        run: python -X utf8 tools/build.py

      - name: Prepare minimal release bundle
        run: |
          mkdir -p release_pkg/build release_pkg/src release_pkg/tools
          cp build/zh-cn.pack.js build/meta.json release_pkg/build/
          cp src/main-hook.js release_pkg/src/
          cp tools/install.ps1 tools/create_shortcut.ps1 tools/install.py tools/asar.py release_pkg/tools/
          cp *.bat README.md release_pkg/
          cd release_pkg && zip -r ../Antigravity-zh-cn.zip .
          ls -lh ../Antigravity-zh-cn.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-zh-cn
          path: Antigravity-zh-cn.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Antigravity-zh-cn.zip
          generate_release_notes: true
